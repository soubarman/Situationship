<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situationship — Verification Admin</title>
  <meta name="description" content="Admin dashboard for managing Situationship identity verifications">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <!-- Logo -->
    <div class="login-logo">
      <div class="s-badge-large">S</div>
      <h1>Verification Console</h1>
      <p>Situationship · Admin Access</p>
    </div>

    <!-- Login Form -->
    <div class="glass-card login-card">
      <h2>Sign In</h2>
      <p class="subtitle">Only authorized admins can access this panel.</p>

      <div id="error-banner" class="error-banner hidden"></div>

      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="admin@situationship.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn-primary" id="login-btn" onclick="handleLogin()">
        <span id="login-text">Sign In</span>
        <div id="login-spinner" class="spinner hidden"></div>
      </button>
    </div>

    <p class="login-footer">
      This dashboard is restricted to Situationship team members only.
    </p>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    // ── Firebase Config ─────────────────────────────────────────────
    // REPLACE WITH YOUR ACTUAL FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBo21crFp9ui4bXzqHxFJnGoMmOH8uDoVg",
      authDomain: "situation-ship.firebaseapp.com",
      projectId: "situation-ship",
      storageBucket: "situation-ship.firebasestorage.app",
      messagingSenderId: "990817672883",
      appId: "1:990817672883:web:b9d16252fcd56fee4c9ac6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Make globally accessible
    window._auth = auth;
    window._db = db;
    window._signIn = signInWithEmailAndPassword;
    window._doc = doc;
    window._getDoc = getDoc;

    // ── Strict admin whitelist ─────────────────────────────────────
    const ALLOWED_ADMIN_EMAIL = 'situationship@gmail.com';
    window._ALLOWED_ADMIN_EMAIL = ALLOWED_ADMIN_EMAIL;

    // Auto-redirect if already logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Strict email check — no localhost bypass
        if (user.email !== ALLOWED_ADMIN_EMAIL) {
          await window._auth.signOut();
          showError('Access denied. This account is not authorized.');
          return;
        }
        window.location.href = '/admin/dashboard/index.html';
      }
    });
  </script>

  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const text = document.getElementById('login-text');
      const spinner = document.getElementById('login-spinner');

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      text.classList.add('hidden');
      spinner.classList.remove('hidden');
      hideError();

      try {
        const cred = await window._signIn(window._auth, email, password);

        // Strict email whitelist — only the designated admin email is allowed
        if (cred.user.email !== window._ALLOWED_ADMIN_EMAIL) {
          await window._auth.signOut();
          showError('Access denied. This account is not authorized.');
          return;
        }

        window.location.href = '/admin/dashboard/index.html';
      } catch (err) {

        let message = 'Sign in failed. Check your credentials.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          message = 'Invalid email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          message = 'Too many failed attempts. Please try again later.';
        }
        showError(message);
      } finally {
        btn.disabled = false;
        text.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    }

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      banner.textContent = '⚠ ' + msg;
      banner.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-banner').classList.add('hidden');
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
