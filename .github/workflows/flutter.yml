name: Situationship Android Local AI APK Build & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Native ARM64 & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK and CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Cache llama.cpp C++ Source
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/llama.cpp
          key: ${{ runner.os }}-llama-cpp-b12676

      - name: Clone llama.cpp source if not cached
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          echo "Cloning llama.cpp source repository..."
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git android/app/src/main/cpp/llama.cpp

      - name: Setup Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze lib/core/ai/ lib/features/cupid_ai/

      - name: Run On-Device AI & Matching Engine Tests
        run: |
          flutter test test/local_llm_reasoning_test.dart
          flutter test test/intelligent_conversational_ai_test.dart
          flutter test test/on_device_ai_matcher_test.dart
          flutter test test/matching_algorithm_test.dart
          flutter test test/multi_turn_conversational_simulation_test.dart
          flutter test test/adversarial_conversational_evaluation_test.dart

      - name: Configure Android Build Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring production signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          elif [ ! -f android/key.properties ] && [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Generating CI debug keystore for release artifact packaging..."
            keytool -genkey -v -keystore android/app/ci-release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass situationshipci -keypass situationshipci -dname "CN=Situationship CI, OU=Engineering, O=Situationship, L=City, S=State, C=US"
            cat <<EOF > android/key.properties
          storePassword=situationshipci
          keyPassword=situationshipci
          keyAlias=androidkey
          storeFile=ci-release.keystore
          EOF
          fi

      - name: Build Android ARM64 Release APK with Native llama.cpp
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: situationship-cupid-local-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: |
            android/app/build/reports/
            build/app/outputs/logs/
