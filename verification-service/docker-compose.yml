version: "3.9"

services:

  # ── Redis (Message Broker + Result Backend) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI API Server ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Allow time for model loading
    expose:
      - "8000"
    # Memory limit: prevents OOM on small servers
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    # Worker is the heavy process — give it more memory
    mem_limit: 3g
    deploy:
      resources:
        limits:
          memory: 3G

  # ── Flower (Celery Task Monitor) ──────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    depends_on:
      - redis
    expose:
      - "5555"
    # Only accessible via Nginx (not publicly exposed directly)

  # ── Nginx (Reverse Proxy + SSL) ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       # Mount your SSL certs here
      - nginx_logs:/var/log/nginx
    depends_on:
      - api

volumes:
  redis_data:
  nginx_logs:
