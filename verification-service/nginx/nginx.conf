
events {
    worker_processes auto;
    worker_connections 1024;
}

http {
    # ── Rate Limiting Zones ──────────────────────────────────────────────────
    # 10 requests/second per IP for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 1 request/second for verification endpoint
    limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=1r/s;

    # ── Upstream (FastAPI) ───────────────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ── Upstream (Flower monitor — admin only) ───────────────────────────────
    upstream flower_backend {
        server flower:5555;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS Server ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name verify.yourdomain.com;   # ← Change to your domain

        # SSL certificates (Let's Encrypt recommended)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Hide server info
        server_tokens off;

        # ── API Proxy ────────────────────────────────────────────────────────
        location /api/ {
            # Global rate limit
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout for model inference (allow up to 120s)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Body size limit (video uploads are handled via Firebase Storage,
            # so actual request bodies are small)
            client_max_body_size 1m;
        }

        # ── Stricter limit on verify endpoint ────────────────────────────────
        location /api/v1/verify {
            limit_req zone=verify_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Flower Dashboard (restrict to internal/admin only) ───────────────
        location /flower/ {
            # Only allow admin IPs — add your IP here
            allow 127.0.0.1;
            deny all;

            proxy_pass http://flower_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health check (no rate limit) ─────────────────────────────────────
        location /health {
            proxy_pass http://api_backend/health;
        }

        # ── Block everything else ─────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
